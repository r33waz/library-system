version: "3.8"

services:
  frontend:
    image: r33waz/library-frontend:v3
    ports:
      - "80:80"         # Production port
    depends_on:
      - backend
    restart: always

  backend:
    image: r33waz/library-backend:v3
    ports:
      - "8000:8000"
    env_file:
      - ./backend.env
    depends_on:
      - postgres
      - redis
    restart: always

  postgres:
    image: postgres:alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: yourdb
      POSTGRES_USER: youruser
      POSTGRES_PASSWORD: yourpassword
    restart: always

  redis:
    image: redis:alpine
    restart: always

volumes:
  pgdata:
