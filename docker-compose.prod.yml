services:
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.prod
    ports:
      - "3000:3000"         # Production port for serve
    depends_on:
      - backend
    restart: always

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile.prod
    network_mode: host
    env_file:
      - ./backend/.env
    # depends_on:
    #   - redis
    restart: always

