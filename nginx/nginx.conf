# =========================
# Nginx Configuration File
# =========================

server {
    # Listen on port 80 for HTTP requests
    listen 80;

    # Server name (can be your domain in production)
    server_name localhost;

    # Root folder where your frontend build files are located
    root /usr/share/nginx/html;

    # Default index file
    index index.html;

    # Enable gzip compression for faster load times
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # -------------------------
    # React SPA Routing
    # -------------------------
    # Any requests to '/' or frontend routes
    location / {
        # try_files will first try the exact file ($uri), then a folder ($uri/), 
        # and finally fallback to /index.html (needed for React SPA routing)
        try_files $uri $uri/ /index.html;
    }

    # -------------------------
    # API Reverse Proxy
    # -------------------------
    # Routes starting with /api/ will be proxied to backend service
    location /api/ {
        proxy_pass http://backend:8000;  # Forward requests to backend container
        proxy_http_version 1.1;          # Use HTTP 1.1 for WebSockets support
        proxy_set_header Upgrade $http_upgrade;   # Allow WebSocket upgrades
        proxy_set_header Connection 'upgrade';   # Keep connection alive
        proxy_set_header Host $host;             # Preserve original host header
        proxy_cache_bypass $http_upgrade;        # Bypass cache if upgrading WebSocket
    }

    # -------------------------
    # Static File Caching
    # -------------------------
    # Serve static assets with long cache expiry
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 1M;                           # Cache files for 1 month
        add_header Cache-Control "public";    # Mark cache as public
    }

    # -------------------------
    # Custom Error Pages
    # -------------------------
    # Serve a custom 404 page
    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;  # Location of the 404 page
        internal;                    # Cannot be accessed directly by URL
    }

    # Serve custom 50x error pages for server errors
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;  # Location of the 50x page
        internal;
    }
}
